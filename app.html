<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINNEX - Tu banco digital</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=42">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* ============ SHELL (estructura). Los colores vienen de styles.css ============ */
    * { box-sizing: border-box; }
    body.app-body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bone, #F5F0E8);
      color: var(--dark, #1E293B);
    }
    body.no-scroll { overflow: hidden; }

    /* ---------- Sidebar ---------- */
    .app-sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 260px;
      background: var(--bg-card, #FFFFFF);
      border-right: 1px solid var(--border, #E5E0D8);
      display: flex;
      flex-direction: column;
      z-index: 1100;
      transition: transform .25s ease;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 26px 22px 18px;
    }
    .sidebar-header .logo-text {
      font-size: 20px;
      font-weight: 800;
      color: var(--wine, #6A0D2E);
      text-decoration: none;
      letter-spacing: .3px;
    }
    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 6px 12px 16px;
    }
    .sidebar-group-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-light, #8A8A8A);
      padding: 16px 12px 6px;
    }
    .sidebar-divider {
      height: 1px;
      background: var(--border, #E5E0D8);
      margin: 12px 8px;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 2px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--dark, #1E293B);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .sidebar-link .icon {
      width: 24px;
      display: inline-flex;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .sidebar-link:hover { background: rgba(106, 13, 46, .05); }
    .sidebar-link.active {
      background: rgba(106, 13, 46, .09);
      color: var(--wine, #6A0D2E);
      font-weight: 700;
      box-shadow: inset 3px 0 0 var(--gold, #D1B474);
    }
    .sidebar-link.logout-btn { color: #B91C1C; }
    .sidebar-link.logout-btn:hover { background: #FDECEC; }

    /* ---------- Grupos desplegables ---------- */
    .sidebar-group { margin-bottom: 4px; }
    .sidebar-group-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--dark, #1E293B);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background .15s;
    }
    .sidebar-group-toggle:hover { background: rgba(106, 13, 46, .05); }
    .sidebar-group-toggle .icon {
      width: 24px;
      display: inline-flex;
      justify-content: center;
      font-size: 16px;
    }
    .sidebar-group-toggle .chev {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-light, #8A8A8A);
      transition: transform .25s ease;
    }
    .sidebar-group.open > .sidebar-group-toggle .chev { transform: rotate(180deg); }
    .sidebar-group.open > .sidebar-group-toggle { color: var(--wine, #6A0D2E); }

    .sidebar-submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
      padding-left: 14px;
    }
    .sidebar-group.open > .sidebar-submenu { max-height: 1200px; }
    .sidebar-submenu .sidebar-link {
      font-size: 13.5px;
      padding: 9px 14px 9px 14px;
    }

    /* Pie del menú */
    .sidebar-footer {
      padding: 14px 16px 18px;
      border-top: 1px solid var(--border, #E5E0D8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .user-profile-top { cursor: pointer; }
    .avatar-small {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--wine, #6A0D2E);
      color: #FFFFFF;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .footer-actions { display: flex; gap: 8px; }
    .theme-toggle-btn, .notification-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border, #E5E0D8);
      background: var(--bg-card, #FFFFFF);
      font-size: 16px;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .theme-toggle-btn:hover, .notification-btn:hover { background: var(--bone, #F5F0E8); }

    /* ---------- Contenido principal ---------- */
    .app-main {
      margin-left: 260px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .page-header {
      padding: 28px 32px 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mobile-menu-btn {
      display: none;
      width: 40px; height: 40px;
      border: 1px solid var(--border, #E5E0D8);
      border-radius: 10px;
      background: var(--bg-card, #FFFFFF);
      font-size: 18px;
      cursor: pointer;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .topbar-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      color: var(--wine, #6A0D2E);
    }
    .page-content {
      padding: 20px 32px 48px;
      max-width: 1280px;
      width: 100%;
    }

    .section-heading {
      font-size: 15px;
      font-weight: 700;
      color: var(--dark, #1E293B);
      margin: 0 0 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-heading a { font-size: 13px; color: var(--wine, #6A0D2E); }

    /* ---------- Grids responsive del dashboard ---------- */
    .dash-grid-2col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .dash-grid-3col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .dash-grid-3col > .app-section { min-width: 0; }

    /* Contenedores de gráficas: alto controlado por CSS, Chart.js llena el espacio */
    .chart-box {
      position: relative;
      width: 100%;
      height: 260px;
    }
    .chart-box.chart-pie { height: 260px; }

    /* ---------- Overlay móvil ---------- */
    .sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, .4);
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
      z-index: 1050;
    }
    .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

    /* ---------- Chat y soporte ---------- */
    .chat-fab {
      position: fixed; bottom: 24px; right: 24px;
      width: 68px; height: 68px;
      border: none; padding: 0;
      background: transparent;
      cursor: pointer;
      z-index: 1000;
    }
    .support-fab {
      position: fixed; bottom: 24px; left: 284px;
      width: 52px; height: 52px;
      background: #25D366;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(37, 211, 102, .35);
      z-index: 1000;
      transition: transform .2s;
    }
    .support-fab:hover { transform: scale(1.08); }

    /* ---------- Responsive: tablet (≤1024px) ---------- */
    @media (max-width: 1024px) {
      .app-sidebar { transform: translateX(-100%); box-shadow: 0 12px 40px rgba(0,0,0,.2); }
      .app-sidebar.open { transform: translateX(0); }
      .app-main { margin-left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .support-fab { left: 20px; }
      .page-header { padding: 22px 24px 0; }
      .page-content { padding: 16px 24px 40px; }
      .dash-grid-3col { grid-template-columns: 1fr; }
    }

    /* ---------- Responsive: celular (≤640px) ---------- */
    @media (max-width: 640px) {
      .dash-grid-2col,
      .dash-grid-3col { grid-template-columns: 1fr; gap: 14px; }
      /* Tarjetas en línea (inline style) pasan a una columna */
      .dash-grid-2col [style*="grid-template-columns: 1fr 1fr"],
      div[style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
      .chart-box { height: 220px; }
      .chart-box.chart-pie { height: 240px; }
      .page-header { padding: 18px 16px 0; }
      .page-content { padding: 14px 16px 40px; }
      .topbar-title { font-size: 20px; }
      .support-fab { bottom: 16px; left: 16px; width: 48px; height: 48px; }
      .chat-fab { width: 60px; height: 60px; right: 14px; bottom: 14px; }
    }
  </style>
</head>

  <script>
    // Abre o cierra un grupo del menú (Productos, Solicitudes, Trámites)
    function toggleGrupo(btn) {
      const grupo = btn.parentElement;
      const abierto = grupo.classList.toggle('open');
      btn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
    }
  </script>
