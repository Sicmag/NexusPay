<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINNEX - Tu banco digital</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=31">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    /* Colores base para el app */
    :root {
      --wine: #6A0D2E;
      --wine-dark: #3E0721;
      --gold: #D4AF37;
      --bone: #F4F1EE;
      --text: #2D2D2D;
      --text-light: #7A7A7A;
      --white: #FFFFFF;
    }
    /* Estilos rápidos para el grid de servicios */
    .servicios-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .servicio-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; background: var(--white); border: 2px solid var(--bone); border-radius: 12px; cursor: pointer; transition: all 0.2s ease; }
    .servicio-item:hover { border-color: var(--wine); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(106, 13, 46, 0.1); }
    .servicio-item.selected { border-color: var(--wine); background: rgba(106, 13, 46, 0.05); }
    .servicio-logo { width: 48px; height: 48px; border-radius: 50%; object-fit: contain; background: var(--white); padding: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    .servicio-logo-fallback { width: 48px; height: 48px; border-radius: 50%; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    .servicio-item span { font-size: 12px; font-weight: 700; color: var(--text); }
    @media (max-width: 400px) { .servicios-grid { grid-template-columns: repeat(2, 1fr); } }
    
    .support-fab { position: fixed; bottom: 24px; left: 24px; width: 56px; height: 56px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); z-index: 1000; transition: transform 0.2s; }
    .support-fab:hover { transform: scale(1.1); }
  </style>
</head>
<body class="app-body dark-mode-off">

  <!-- SONIDO DE APP -->
  <audio id="sonidoApp" src="https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3" preload="auto"></audio>

  <!-- SIDEBAR -->
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-header" style="display: flex; align-items: center; gap: 12px; padding: 24px;">
      <img src="logo.png" alt="FINNEX Logo" style="width: 40px; height: 40px; border-radius: 10px; object-fit: cover;">
      <a href="app.html" class="logo-text" style="font-size: 20px; text-decoration: none; margin: 0;">FINNEX</a>
    </div>

    <div class="sidebar-menu">
      <div id="menuNaturalSidebar" style="display:none;">
        <button class="sidebar-link active" data-page="dashboard" onclick="navegarA('dashboard')"><span class="icon">🏠</span> Dashboard</button>
        <button class="sidebar-link" data-page="flowpay" onclick="navegarA('flowpay')"><span class="icon">💸</span> NEXA (Ahorros)</button>
        <button class="sidebar-link" data-page="flowcard" onclick="navegarA('flowcard')"><span class="icon">💳</span> Tarjeta FNX</button>
        <button class="sidebar-link" data-page="flowinvest" onclick="navegarA('flowinvest')"><span class="icon">📈</span> NEXO (CDT)</button>
        <button class="sidebar-link" data-page="nexusbox" onclick="navegarA('nexusbox')"><span class="icon">🎁</span> Cajitas FNX</button>
        <button class="sidebar-link" data-page="flowsave" onclick="navegarA('flowsave')"><span class="icon">🏦</span> VELA / NEXT</button>
        <button class="sidebar-link" data-page="flowshield" onclick="navegarA('flowshield')"><span class="icon">🛡️</span> FIN-SAFE</button>
        <button class="sidebar-link" data-page="creditos" onclick="navegarA('creditos')"><span class="icon">💳</span> Crédito Personal</button>
        <button class="sidebar-link" data-page="simulador" onclick="navegarA('simulador')"><span class="icon">🧮</span> Simulador</button>
      </div>

      <div id="menuEmprendedorSidebar" style="display:none;">
        <button class="sidebar-link active" data-page="dashboard" onclick="navegarA('dashboard')"><span class="icon">🏠</span> Dashboard</button>
        <button class="sidebar-link" data-page="flowpay" onclick="navegarA('flowpay')"><span class="icon">💸</span> NEXA (Pagos)</button>
        <button class="sidebar-link" data-page="flowcard" onclick="navegarA('flowcard')"><span class="icon">💳</span> Tarjeta FNX</button>
        <button class="sidebar-link" data-page="flowinvest" onclick="navegarA('flowinvest')"><span class="icon">📈</span> NEXO (Inversiones)</button>
        <button class="sidebar-link" data-page="nexusbox" onclick="navegarA('nexusbox')"><span class="icon">🎁</span> Cajitas FNX</button>
        <button class="sidebar-link" data-page="flowsave" onclick="navegarA('flowsave')"><span class="icon">🏦</span> VELA / NEXT</button>
        <button class="sidebar-link" data-page="flowshield" onclick="navegarA('flowshield')"><span class="icon">🛡️</span> FIN-SAFE</button>
        <button class="sidebar-link" data-page="flowbusiness" onclick="navegarA('flowbusiness')"><span class="icon">💼</span> FIN-BIZ</button>
        <button class="sidebar-link" data-page="flowanalytics" onclick="navegarA('flowanalytics')"><span class="icon">📊</span> FIN-360</button>
        <button class="sidebar-link" data-page="activos" onclick="navegarA('activos')"><span class="icon">♻️</span> FINNEX Activos</button>
        <button class="sidebar-link" data-page="creditos" onclick="navegarA('creditos')"><span class="icon">💳</span> FAMILIA NEXAR</button>
        <button class="sidebar-link" data-page="simulador" onclick="navegarA('simulador')"><span class="icon">🧮</span> Simulador</button>
      </div>

      <div class="sidebar-divider"></div>
      
      <button class="sidebar-link" data-page="perfil" onclick="navegarA('perfil')"><span class="icon">⚙️</span> Configuración</button>
      <button class="sidebar-link" data-page="verificacion" onclick="navegarA('verificacion')"><span class="icon">✓</span> Verificación</button>
      <button class="sidebar-link" data-page="notificaciones" onclick="navegarA('notificaciones')"><span class="icon">🔔</span> Notificaciones</button>

      <button class="sidebar-link logout-btn" onclick="cerrarSesion()"><span class="icon">🚪</span> Cerrar Sesión</button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="app-main">
    <header class="app-topbar-new">
      <div class="topbar-left">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <h1 class="topbar-title" id="pageTitle">Overview</h1>
      </div>
      
      <div class="topbar-right">
        <div class="search-bar">
          <span>🔍</span>
          <input type="text" placeholder="Buscar en FINNEX...">
        </div>
        <button class="theme-toggle-btn" onclick="toggleTema()">🌙</button>
        <button class="notification-btn" onclick="navegarA('notificaciones')">🔔</button>
        <div class="user-profile-top" onclick="navegarA('perfil')">
          <div class="avatar-small" id="topAvatar">👤</div>
        </div>
      </div>
    </header>

    <div class="page-content" id="pageContent">
      <div class="loading-spinner"></div>
    </div>
  </main>

  <!-- FAB CHAT CON EL ROBOT -->
  <button class="chat-fab" id="chatFab" onclick="toggleChat()" aria-label="Chat con Luci" style="background: none; border: none; padding: 0;">
    <img src="robot.png" alt="Luci" style="width: 100%; height: 100%; object-fit: contain;">
  </button>

    <!-- FAB CHAT CON EL ROBOT -->
  <button class="chat-fab" id="chatFab" onclick="toggleChat()" aria-label="Chat con Luci" style="background: transparent !important; border: none !important; box-shadow: none !important; padding: 0;">
    <img src="robot.png" alt="Luci" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 5px 15px rgba(212, 175, 55, 0.4));">
  </button>
  <!-- CHAT WINDOW -->
  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-header-name">Luci</div>
        <div class="chat-header-status">En línea</div>
      </div>
      <button class="chat-close" onclick="toggleChat()">×</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-message chat-bot">Hola! Soy Luci, tu asistente de FINNEX. ¿En qué te ayudo hoy? 💜</div>
    </div>
    <div class="chat-input-wrapper">
      <input class="chat-input" id="chatInput" placeholder="Escribe tu pregunta..." onkeypress="if(event.key==='Enter') enviarChat()">
      <button class="chat-send" onclick="enviarChat()">➤</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/app.js"></script>
</body>
