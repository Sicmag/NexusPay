<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINNEX - Tu banco digital</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* =========================================================
       1. VARIABLES (paleta original de FINNEX)
       ========================================================= */
    :root {
      --wine: #6A0D2E;
      --wine-soft: rgba(106, 13, 46, .08);
      --gold: #D1B474;
      --lila: #CCB3E2;
      --bone: #F5F0E8;
      --bg-card: #FFFFFF;
      --border: #E5E0D8;
      --dark: #1E293B;
      --text-light: #64748B;
      --primary: #2563EB;
      --green: #10B981;
      --red: #EF4444;
      --bg-soft: #EFEAE2;
      --sidebar-w: 260px;
      --header-h: 0px;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(30, 41, 59, .06);
    }

    /* =========================================================
       2. BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body.app-body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bone);
      color: var(--dark);
      overflow-x: hidden;
      font-size: 15px;
      line-height: 1.45;
    }
    body.no-scroll { overflow: hidden; }
    img { max-width: 100%; height: auto; }
    button { font-family: inherit; }

    /* =========================================================
       3. SIDEBAR (menú)
       ========================================================= */
    .app-sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1100;
      transition: transform .28s ease;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px 22px 16px;
      flex-shrink: 0;
    }
    .sidebar-header img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
    .logo-text {
      font-size: 20px;
      font-weight: 800;
      color: var(--wine);
      text-decoration: none;
      letter-spacing: .3px;
    }
    .sidebar-menu {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 12px 16px;
      overscroll-behavior: contain;
    }
    .sidebar-group-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-light);
      padding: 14px 12px 6px;
    }
    .sidebar-divider { height: 1px; background: var(--border); margin: 10px 8px; }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      margin-bottom: 2px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--dark);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .sidebar-link .icon {
      width: 24px;
      display: inline-flex;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .sidebar-link:hover { background: rgba(106, 13, 46, .05); }
    .sidebar-link.active {
      background: rgba(106, 13, 46, .09);
      color: var(--wine);
      font-weight: 700;
      box-shadow: inset 3px 0 0 var(--gold);
    }
    .sidebar-link.logout-btn { color: #B91C1C; }
    .sidebar-link.logout-btn:hover { background: #FDECEC; }

    /* Grupos desplegables */
    .sidebar-group { margin-bottom: 2px; }
    .sidebar-group-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--dark);
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background .15s;
    }
    .sidebar-group-toggle:hover { background: rgba(106, 13, 46, .05); }
    .sidebar-group-toggle .icon {
      width: 24px;
      display: inline-flex;
      justify-content: center;
      font-size: 16px;
    }
    .sidebar-group-toggle .chev {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-light);
      transition: transform .25s ease;
    }
    .sidebar-group.open > .sidebar-group-toggle { color: var(--wine); }
    .sidebar-group.open > .sidebar-group-toggle .chev { transform: rotate(180deg); }
    .sidebar-submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
      padding-left: 12px;
    }
    .sidebar-group.open > .sidebar-submenu { max-height: 1400px; }
    .sidebar-submenu .sidebar-link { font-size: 13.5px; min-height: 42px; }

    /* Pie del menú */
    .sidebar-footer {
      flex-shrink: 0;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .user-profile-top { cursor: pointer; }
    .avatar-small {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--wine);
      color: #FFF;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .avatar-small img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .footer-actions { display: flex; gap: 8px; }
    .theme-toggle-btn, .notification-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 16px;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .theme-toggle-btn:hover, .notification-btn:hover { background: var(--bone); }

    /* Overlay para cerrar el menú en tablet/celular */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 1050;
    }
    .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

    /* =========================================================
       4. ÁREA PRINCIPAL
       ========================================================= */
    .app-main {
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 26px 32px 0;
    }
    .mobile-menu-btn {
      display: none;
      width: 44px; height: 44px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-card);
      font-size: 18px;
      cursor: pointer;
      align-items: center; justify-content: center;
    }
    .topbar-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      color: var(--wine);
      line-height: 1.2;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .page-content {
      width: 100%;
      max-width: 1280px;
      padding: 20px 32px 90px;
      min-width: 0;
    }
    .loading-spinner {
      width: 36px; height: 36px;
      margin: 40px auto;
      border: 3px solid var(--border);
      border-top-color: var(--wine);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
    }
    .section-heading a { font-size: 13px; color: var(--wine); font-weight: 600; }

    /* =========================================================
       5. GRIDS (responsive por ancho de pantalla)
       ========================================================= */
    .dash-grid-2col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .dash-grid-3col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .dash-grid-2col > *, .dash-grid-3col > * { min-width: 0; }

    .chart-box { position: relative; width: 100%; height: 260px; }
    .chart-box canvas { max-width: 100%; }

    /* =========================================================
       6. COMPONENTES: SECCIONES, WIDGETS, BOTONES, FORMULARIOS
       ========================================================= */
    .app-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .app-section-title { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 14px; }

    .widget-metric {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      min-width: 0;
    }
    .widget-icon {
      width: 46px; height: 46px;
      flex-shrink: 0;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      background: var(--bone);
    }
    .widget-icon.blue { background: #E8F0FF; }
    .widget-icon.green { background: #E7F7EE; }
    .widget-icon.red { background: #FDECEC; }
    .widget-icon.yellow { background: #FFF6D6; }
    .widget-info { min-width: 0; }
    .widget-info .label { font-size: 13px; color: var(--text-light); }
    .widget-info .value { font-size: 20px; font-weight: 800; color: var(--dark); word-break: break-word; }

    .text-green { color: #15803D; }
    .text-red { color: #B91C1C; }

    .btn-primary, .btn-secondary, .btn-secondary-sm {
      min-height: 44px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s, box-shadow .15s;
    }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px;
      border: none;
      background: var(--wine);
      color: #FFF;
    }
    .btn-primary:hover { background: #520A24; }
    .btn-primary:active { transform: scale(.99); }
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--dark);
    }
    .btn-secondary:hover { border-color: var(--wine); }
    .btn-secondary-sm {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--dark);
    }
    .btn-large { width: 100%; padding: 13px 18px; font-size: 15px; }
    .btn-primary.btn-large, .btn-secondary.btn-large { width: 100%; }
    .eye-btn { min-width: 36px; min-height: 36px; cursor: pointer; }

    .app-form-group { margin-bottom: 16px; min-width: 0; }
    .app-form-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--dark); }
    .app-form-input, .app-form-select {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border: 1px solid #D6D0C6;
      border-radius: 10px;
      background: #FFF;
      font: inherit;
      font-size: 16px; /* evita zoom automático en iPhone */
      color: var(--dark);
      outline: none;
    }
    .app-form-input:focus, .app-form-select:focus {
      border-color: var(--wine);
      box-shadow: 0 0 0 3px rgba(106, 13, 46, .12);
    }
    .slider { width: 100%; accent-color: var(--wine); }

    /* Pestañas: deslizables en pantallas pequeñas */
    .app-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .app-tabs::-webkit-scrollbar { display: none; }
    .app-tab {
      flex-shrink: 0;
      min-height: 44px;
      padding: 10px 14px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      white-space: nowrap;
    }
    .app-tab.active { color: var(--wine); border-bottom-color: var(--gold); }
    .app-tab-content { display: none; }
    .app-tab-content.active { display: block; }

    /* Tablas: scroll horizontal dentro de su contenedor */
    .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .app-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 480px; }
    .app-table th {
      text-align: left;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: .04em;
      border-bottom: 1px solid var(--border);
    }
    .app-table td { padding: 12px 10px; border-bottom: 1px solid #F1EDE6; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-green { background: #E7F7EE; color: #17803D; }
    .badge-blue { background: #E8F0FF; color: #1D4ED8; }
    .badge-red { background: #FDECEC; color: #B91C1C; }
    .badge-yellow { background: #FFF6D6; color: #8A6D00; }
    .badge-purple { background: #F3E8FF; color: #7E22CE; }

    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 14px;
      margin-bottom: 14px;
      word-break: break-word;
    }
    .alert-success { background: #E7F7EE; color: #14532D; border-color: #BFE7CF; }
    .alert-warning { background: #FFF8DB; color: #713F12; border-color: #F5E28A; }
    .alert-error { background: #FDECEC; color: #7F1D1D; border-color: #F5C2C2; }
    .alert-info { background: #E8F0FF; color: #1E3A8A; border-color: #BFD4FF; }

    /* =========================================================
       7. TARJETAS DE CRÉDITO (dashboard y FinCard)
       ========================================================= */
    .credit-card-horizontal {
      position: relative;
      width: 100%;
      min-height: 176px;
      padding: 20px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(30, 41, 59, .12);
      min-width: 0;
    }
    .credit-card-horizontal.blue { background: linear-gradient(135deg, #6A0D2E 0%, #9B1B45 100%); color: #FFF; }
    .credit-card-horizontal.white { background: #FFF; color: var(--dark); border: 1px solid var(--border); }
    .cc-top, .cc-middle, .cc-bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; min-width: 0; }
    .cc-balance-label { font-size: 12px; opacity: .85; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .cc-balance { font-size: clamp(18px, 3.6vw, 26px); font-weight: 800; word-break: break-word; }
    .cc-chip { font-size: 22px; }
    .cc-label { font-size: 10px; opacity: .75; text-transform: uppercase; letter-spacing: .06em; }
    .cc-value { font-size: 13px; font-weight: 700; word-break: break-word; }
    .cc-number { font-size: clamp(13px, 2.6vw, 17px); letter-spacing: 1.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cc-logo { font-weight: 900; font-style: italic; font-size: 18px; letter-spacing: 1px; }

    /* =========================================================
       8. TRANSACCIONES RECIENTES
       ========================================================= */
    .transaction-list { display: flex; flex-direction: column; gap: 8px; }
    .transaction-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      min-width: 0;
    }
    .transaction-item > div:first-child { min-width: 0; flex: 1; }
    .t-icon {
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; margin-right: 12px;
    }
    .t-icon.in { background: #E7F7EE; color: #15803D; }
    .t-icon.out { background: #FDECEC; color: #B91C1C; }
    .t-info { min-width: 0; }
    .t-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-date { font-size: 12px; color: var(--text-light); }
    .t-amount { font-size: 14px; font-weight: 800; white-space: nowrap; }
    .t-amount.in { color: #15803D; }
    .t-amount.out { color: #B91C1C; }

    /* =========================================================
       9. GRIDS DE PRODUCTOS (cajitas, trámites, servicios, contactos)
       ========================================================= */
    .cajitas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: 16px;
    }
    .cajita-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      min-width: 0;
    }
    .meta-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }

    .tramites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
      gap: 16px;
      margin-top: 18px;
    }
    .tramite-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: 4px solid var(--gold);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .2s, box-shadow .2s;
      min-width: 0;
    }
    .tramite-card:hover, .tramite-card:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(106, 13, 46, .12); outline: none; }
    .tramite-icono {
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      border-radius: 12px;
      background: var(--wine-soft);
      margin-bottom: 6px;
    }
    .tramite-titulo { font-weight: 700; font-size: 15px; color: var(--dark); }
    .tramite-desc { font-size: 13px; color: var(--text-light); flex: 1; }
    .tramite-link { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--wine); }

    .contactos-grid { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
    .contacto-item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 70px; cursor: pointer; }
    .contacto-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--wine);
      color: #FFF;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .contacto-nombre { font-size: 12px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .servicios-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .servicio-item {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 16px 8px;
      min-height: 44px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
    }
    .servicio-item.selected { border-color: var(--wine); background: var(--wine-soft); }
    .servicio-logo { width: 48px; height: 48px; border-radius: 50%; object-fit: contain; background: #FFF; padding: 4px; }
    .servicio-logo-fallback { width: 48px; height: 48px; border-radius: 50%; align-items: center; justify-content: center; font-size: 22px; }
    .servicio-item span { font-size: 12px; font-weight: 700; }

    .faq-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; padding: 14px 16px; cursor: pointer; }
    .faq-question { font-weight: 700; display: flex; justify-content: space-between; gap: 10px; }
    .faq-answer { display: none; margin-top: 10px; font-size: 14px; color: var(--text-light); }
    .faq-item.active .faq-answer { display: block; }

    /* =========================================================
       10. MODALES
       ========================================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 23, 42, .55);
    }
    .modal-card {
      width: min(460px, 100%);
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--bg-card);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-title { font-size: 18px; font-weight: 800; }
    .modal-close {
      width: 40px; height: 40px;
      border: none; background: none;
      font-size: 26px; line-height: 1;
      color: var(--text-light);
      cursor: pointer;
    }

    /* =========================================================
       11. CHAT LUCI Y SOPORTE
       ========================================================= */
    .chat-fab {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 66px; height: 66px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 1000;
    }
    .support-fab {
      position: fixed;
      right: 96px;
      bottom: 28px;
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: #25D366;
      box-shadow: 0 6px 16px rgba(37, 211, 102, .35);
      z-index: 1000;
    }
    .chat-window {
      position: fixed;
      right: 20px;
      bottom: 96px;
      width: min(360px, calc(100vw - 32px));
      height: min(500px, 70dvh);
      display: none;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .2);
      overflow: hidden;
      z-index: 1001;
    }
    .chat-window.open { display: flex; }
    .chat-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px;
      background: var(--wine);
      color: #FFF;
    }
    .chat-header-name { font-weight: 700; }
    .chat-header-status { font-size: 12px; opacity: .85; }
    .chat-close { background: none; border: none; color: #FFF; font-size: 24px; cursor: pointer; min-width: 40px; min-height: 40px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bone); }
    .chat-message { max-width: 85%; padding: 10px 12px; border-radius: 12px; font-size: 14px; word-wrap: break-word; }
    .chat-bot { background: #FFF; border: 1px solid var(--border); align-self: flex-start; }
    .chat-user { background: var(--wine); color: #FFF; align-self: flex-end; }
    .chat-loading { font-style: italic; color: var(--text-light); }
    .chat-input-wrapper { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); background: var(--bg-card); }
    .chat-input { flex: 1; min-width: 0; min-height: 44px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: 16px; }
    .chat-send { min-width: 44px; min-height: 44px; border: none; border-radius: 10px; background: var(--gold); color: var(--dark); font-size: 16px; cursor: pointer; }

    /* =========================================================
       12. PANTALLA DE CARGA
       ========================================================= */
    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bone);
      transition: opacity .5s ease, visibility .5s;
    }
    .loader-overlay.oculto { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-content { text-align: center; padding: 20px; }
    .loader-robot { width: 110px; max-width: 40vw; }
    .loader-logo { margin: 8px 0 14px; font-size: 26px; font-weight: 800; color: var(--wine); }
    .loader-spinner {
      width: 34px; height: 34px;
      margin: 0 auto 12px;
      border: 3px solid var(--border);
      border-top-color: var(--wine);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loader-text { font-size: 14px; color: var(--text-light); }

    /* =========================================================
       13. RESPONSIVE
       ========================================================= */

    /* Tablet y celular: menú deslizable */
    @media (max-width: 1099px) {
      .app-sidebar { transform: translateX(-100%); box-shadow: 0 12px 40px rgba(0, 0, 0, .2); }
      .app-sidebar.open { transform: translateX(0); }
      .app-main { margin-left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .support-fab { right: 92px; }
    }

    /* Tablet: dashboard en una columna para gráficas */
    @media (max-width: 900px) {
      .dash-grid-3col { grid-template-columns: 1fr; }
      .page-content { padding: 18px 24px 90px; }
      .page-header { padding: 22px 24px 0; }
    }

    /* Celular */
    @media (max-width: 640px) {
      body.app-body { font-size: 14px; }
      .page-header { padding: 16px 14px 0; gap: 10px; }
      .topbar-title { font-size: 20px; }
      .page-content { padding: 14px 14px 100px; }

      /* Todos los grids inline pasan a una columna */
      .dash-grid-2col,
      .dash-grid-3col,
      [style*="grid-template-columns"] {
        grid-template-columns: 1fr !important;
      }
      /* Excepción: grids de productos y tramites mantienen auto-fill */
      .cajitas-grid, .tramites-grid { grid-template-columns: 1fr !important; }

      .dash-grid-2col, .dash-grid-3col { gap: 14px; }
      .app-section { padding: 16px; border-radius: 12px; }
      .widget-metric { padding: 14px; }
      .widget-info .value { font-size: 18px; }

      .chart-box { height: 220px; }
      .chart-box.chart-pie { height: 240px; }

      .credit-card-horizontal { min-height: 160px; padding: 16px; }
      .cc-number { letter-spacing: 1px; font-size: 12px; }

      .servicios-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .chat-fab { width: 60px; height: 60px; right: 14px; bottom: 14px; }
      .support-fab { width: 48px; height: 48px; right: 84px; bottom: 20px; }
      .chat-window { right: 12px; left: 12px; width: auto; bottom: 86px; height: min(480px, 72dvh); }

      .modal-overlay { padding: 12px; }
      .modal-card { padding: 18px; }

      .sidebar-link, .sidebar-group-toggle { min-height: 48px; }
    }

    /* Celulares muy pequeños */
    @media (max-width: 380px) {
      .topbar-title { font-size: 18px; }
      .servicios-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .app-tab { padding: 10px 10px; font-size: 13px; }
    }
  </style>
</head>
