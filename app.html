  <script>
    // Abre o cierra un grupo del menú (Más productos, Trámites)
    function toggleGrupo(btn) {
      const grupo = btn.parentElement;
      const abierto = grupo.classList.toggle('open');
      btn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
    }

    // Buscador de la barra superior: Enter abre la primera opción del menú que coincida
    document.getElementById('buscadorGlobal').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      const q = this.value.trim().toLowerCase();
      if (!q) return;
      const hit = Array.from(document.querySelectorAll('.sidebar-link[data-page]'))
        .find(function (b) { return b.offsetParent !== null && b.textContent.toLowerCase().includes(q); });
      if (hit) { navegarA(hit.dataset.page); this.value = ''; this.blur(); }
    });
  </script>
